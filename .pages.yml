# Pages CMS dashboard config — https://pagescms.org
# Connect this repo at https://app.pagescms.org (sign in with GitHub)
# to get a visual dashboard: edit text and drag-and-drop images, no code.

media:
  input: assets
  output: /assets
  extensions: [jpg, jpeg, png, gif, webp, svg, avif]

content:
  - name: site
    label: Site & content
    type: file
    path: content/data.json
    fields:
      - name: site
        label: Studio details
        type: object
        fields:
          - { name: name, label: Studio name, type: string }
          - { name: statement, label: Hero statement, type: text }
          - { name: scrollHint, label: "Hero \"scroll down\" label", type: string }
          - { name: eyebrow, label: About eyebrow label, type: string }
          - { name: mission, label: About mission paragraph, type: text }
          - name: contact
            label: Contact modal
            type: object
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: note, label: Note, type: string }
              - name: channels
                label: Contact emails
                type: object
                list: true
                fields:
                  - { name: label, label: Label, type: string }
                  - { name: email, label: Email, type: string }
          - name: socials
            label: Social links
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: url, label: URL, type: string }
          - { name: ctaKickerLeft, label: "Closing CTA — left kicker (desktop only)", type: string }
          - { name: ctaHeading, label: Closing CTA heading, type: string }
          - { name: ctaLink, label: Closing CTA link text, type: string }
          - { name: ctaKickerRight, label: "Closing CTA — right kicker (desktop only)", type: string }
          - { name: credit, label: Footer credit, type: string }

      - name: services
        label: What I do (services)
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: desc, label: Description, type: string }
          - name: tint
            label: Card color
            type: select
            options:
              values: [a, b, c]

      - name: behindTheScenes
        label: Behind the scenes
        type: object
        list: true
        fields:
          - { name: caption, label: Caption, type: string }
          - { name: img, label: Photo, type: image }

      - name: work
        label: Selected work
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - name: cat
            label: Category
            type: select
            options:
              values: [Design, Music, Web, Video, Clothing]
          - { name: year, label: Year, type: string }
          - { name: img, label: Image, type: image }
