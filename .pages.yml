# Pages CMS dashboard config — https://pagescms.org
# Connect this repo at https://app.pagescms.org (sign in with GitHub)
# to get a visual dashboard: edit text and drag-and-drop images, no code.

media:
  input: assets
  output: /assets
  extensions: [jpg, jpeg, png, gif, webp, svg, avif]

content:
  - name: site
    label: Site & projects
    type: file
    path: content/data.json
    fields:
      - name: site
        label: Studio details
        type: object
        fields:
          - { name: name, label: Studio name, type: string }
          - { name: title, label: Browser tab title, type: string }
          - { name: description, label: Meta description, type: text }
          - { name: heroLead, label: "Hero — first line", type: string }
          - { name: heroAccent, label: "Hero — highlighted words", type: string }
          - { name: heroSub, label: "Hero — subtitle", type: text }
          - { name: studioLabel, label: "Studio section label (empty hides it)", type: string }
          - { name: studioBlurb, label: Studio blurb, type: text }
          - { name: disciplines, label: Disciplines, type: string, list: true }
          - { name: softwares, label: Softwares, type: string, list: true }
          - { name: contactLabel, label: Contact label, type: string }
          - { name: email, label: Email, type: string }
          - { name: phone, label: "Phone (empty hides it)", type: string }
          - { name: instagramUrl, label: "Instagram URL (empty hides the icon)", type: string }
          - { name: knotsssUrl, label: "knotsss URL (empty hides the icon)", type: string }

      - name: sections
        label: Home page sections
        description: "Shown top to bottom. Leave title empty for an untitled section (normally the first). projectIds must match a project's id below, in the order they should appear."
        type: object
        list: true
        fields:
          - { name: id, label: Section id, type: string }
          - { name: title, label: "Title (empty = untitled)", type: string }
          - { name: projectIds, label: "Project ids, in order", type: string, list: true }

      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - { name: id, label: "URL slug (e.g. atelier-noir)", type: string }
          - { name: title, label: Title, type: string }
          - { name: category, label: "Category / discipline (shown on the project page)", type: string }
          - { name: year, label: Year, type: string }
          - { name: role, label: Role, type: string }
          - { name: cover, label: Cover (image or video), type: image }
          - name: coverType
            label: Cover type
            type: select
            options:
              values: [image, video]
          - name: aspect
            label: Cover aspect ratio
            type: select
            options:
              values: ["4/5", "16/9", "1/1", "3/4", "3/2"]
          - { name: summary, label: Summary, type: text }
          - { name: narrative, label: Narrative, type: text }
          - { name: embedUrl, label: "Full video link (YouTube or Vimeo, optional)", type: string }
          - { name: loopStart, label: "Loop start (seconds into a video cover; 0 = beginning)", type: number }
          - { name: loopEnd, label: "Loop end (seconds; 0 = play to the end)", type: number }
          - name: gallery
            label: Gallery (extra photos/videos)
            type: object
            list: true
            fields:
              - { name: url, label: File, type: image }
              - name: type
                label: Type
                type: select
                options:
                  values: [image, video]
