<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>DEON — design · music · web · video · clothing</title>
  <meta name="description" content="DEON — graphic design, music, websites, videos, clothing." />
  <meta name="theme-color" content="#160a0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <main id="home">
      <div id="bgs" aria-hidden="true"></div>
      <p id="ghost" aria-hidden="true"></p>
      <div id="stage">
        <div id="covers"></div>
      </div>
      <div id="caption">
        <p id="cap-index"></p>
        <p id="cap-blurb"></p>
      </div>
    </main>
  </div>

  <!-- chrome -->
  <div id="topbar">
    <button id="wordmark" aria-label="DEON home">DEON</button>
    <button id="menu-btn" aria-label="menu"><span></span></button>
  </div>
  <div id="dots" aria-hidden="true"></div>
  <p id="hint">SWIPE →</p>

  <!-- film layers -->
  <canvas id="grain" aria-hidden="true"></canvas>
  <div id="vignette" aria-hidden="true"></div>

  <script>
    Promise.all([
      document.fonts.load("700 100px 'Braun'"),
      document.fonts.load("500 16px 'Braun'"),
      document.fonts.load("300 16px 'Braun'"),
      document.fonts.load("200 16px 'Braun'"),
    ]).catch(() => {}).finally(() => import('./js/app.js'));
  </script>
</body>
</html>
