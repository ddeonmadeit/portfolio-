<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- keeps relative asset URLs resolving from the root on /project/<slug> routes -->
  <base href="/" />
  <title>DEON — Polymathic Studio</title>
  <meta name="description" content="DEON — a seven-year odyssey in visual architecture: graphic design, cinematic editing, sonics, event curation, and fashion production." />
  <meta name="theme-color" content="#120B09" />
  <meta name="color-scheme" content="dark" />

  <meta property="og:title" content="DEON — Polymathic Studio" />
  <meta property="og:description" content="A seven-year odyssey in visual architecture." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/atelier-noir.jpg" />

  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="DEON Portfolio" />

  <link rel="preload" href="fonts/FTOverpass.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/Overpass-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- ===================== MASTHEAD — small, centred, on every page ===================== -->
  <header class="masthead">
    <button type="button" class="logo-mark" id="logo-home" aria-label="DEON — home"></button>
  </header>

  <!-- ===================== HOME ===================== -->
  <div id="home" class="view">
    <!-- TITLE — sits at the very top of the page -->
    <header class="hero">
      <div class="hero-ghost" aria-hidden="true"><span id="ghost-word">DEON</span></div>
      <div class="hero-copy">
        <h1 class="sr-only" id="sr-name">DEON</h1>
        <h2 class="hero-head display">
          <span id="hero-lead"></span><br /><span class="amber" id="hero-accent"></span>
        </h2>
        <p class="hero-sub" id="hero-sub"></p>
        <div class="icon-row" id="hero-icon-row"></div>
      </div>
    </header>

    <!-- PROJECT PREVIEWS — directly below the title. A static (non-
         scrolling) collage per section: the first section is untitled,
         every section after it is titled by project type. Content and
         ordering come entirely from content/data.json, edited at /dash. -->
    <main class="archive" id="archive"></main>

    <!-- STUDIO -->
    <section class="studio" id="studio">
      <p class="label amber" id="studio-label"></p>
      <h2 class="studio-name display" id="studio-name"></h2>
      <p class="studio-blurb" id="studio-blurb"></p>

      <p class="label dim" id="disc-label">DISCIPLINES</p>
      <ul class="disciplines" id="disciplines"></ul>

      <p class="label dim" id="contact-label"></p>
      <ul class="contact">
        <li><a id="email-link" href="#"></a></li>
        <li><a id="phone-link" href="#"></a></li>
        <li><button type="button" id="to-top"></button></li>
      </ul>
      <div class="icon-row" id="contact-icon-row"></div>
    </section>
  </div>

  <!-- ===================== PROJECT DETAIL ===================== -->
  <div id="detail" class="view" hidden>
    <div class="detail-wrap">
      <button type="button" class="mono back-link" id="back-archive-top">ARCHIVE</button>

      <p class="mono dim detail-meta" id="d-meta"></p>
      <h2 class="detail-title display" id="d-title"></h2>

      <div class="detail-cover" id="d-cover"></div>

      <p class="label amber" id="d-brief-label">/ THE BRIEF</p>

      <dl class="detail-specs" id="d-specs"></dl>

      <p class="detail-summary" id="d-summary"></p>
      <p class="detail-narrative" id="d-narrative"></p>

      <div class="detail-embed" id="d-embed" hidden></div>

      <div class="detail-gallery" id="d-gallery"></div>

      <p class="label amber" id="d-continue-label">/ CONTINUE</p>
      <button type="button" class="back-big display" id="back-archive">Back to the Archive</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
