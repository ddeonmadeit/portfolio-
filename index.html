<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DEON — Independent Creative</title>
  <meta name="description" content="DEON — independent creative direction and production across design, music, web, video and clothing." />
  <meta name="theme-color" content="#0d0c0a" />
  <meta name="color-scheme" content="dark" />

  <meta property="og:title" content="DEON — Independent Creative" />
  <meta property="og:description" content="Creative direction & production across design, music, web, video and clothing." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/og.jpg" />

  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preload" href="fonts/BraunLinear-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/BraunLinear-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="loading">
  <!-- ===================== LOADER ===================== -->
  <div id="loader" aria-hidden="true">
    <span class="loader-dot"></span>
    <span id="loader-pct" class="loader-pct">0%</span>
  </div>

  <!-- ===================== HEADER ===================== -->
  <header id="header">
    <a class="wordmark" href="#top" aria-label="DEON home">
      <span class="wordmark-text">DEON</span>
    </a>
    <nav class="nav-desktop" aria-label="Primary">
      <button type="button" data-scroll-to="#work">Work</button>
      <button type="button" data-scroll-to="#studio">About</button>
      <button type="button" id="nav-contact">Contact</button>
    </nav>
    <button id="menu-btn" class="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
      <span></span><span></span>
    </button>
  </header>

  <!-- ===================== MOBILE MENU ===================== -->
  <div id="menu" class="menu" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <ul class="menu-nav">
      <li><button type="button" data-scroll-to="#work">Work</button></li>
      <li><button type="button" data-scroll-to="#studio">About</button></li>
      <li><button type="button" id="menu-contact">Contact</button></li>
    </ul>
    <div class="menu-socials" id="menu-socials"></div>
  </div>

  <!-- ===================== CONTACT MODAL ===================== -->
  <div id="contact-modal" class="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Contact">
      <button class="modal-close" id="modal-close" aria-label="Close contact">✕</button>
      <h2 class="modal-heading" id="modal-heading"></h2>
      <p class="modal-note" id="modal-note"></p>
      <div class="modal-channels" id="modal-channels"></div>
      <div class="modal-socials" id="modal-socials"></div>
    </div>
  </div>

  <main id="top">
    <!-- ===================== HERO (fixed text over a spacer) ===================== -->
    <section class="hero-fixed" id="hero-fixed">
      <h1 class="hero-statement" id="hero-statement"></h1>
      <button class="hero-scroll" id="hero-scroll-hint" data-scroll-to="#studio">
        <span id="hero-scroll-label"></span>
      </button>
    </section>
    <div class="hero-runway" id="hero-runway"></div>

    <!-- ===================== ABOUT / STUDIO ===================== -->
    <section class="section studio" id="studio">
      <p class="eyebrow reveal" id="studio-eyebrow"></p>
      <div class="studio-row">
        <p class="studio-lead" id="studio-mission"></p>
        <canvas class="studio-rock" id="rock" aria-hidden="true"></canvas>
      </div>
    </section>

    <!-- ===================== BEHIND THE SCENES ===================== -->
    <section class="section carousel-section" id="bts">
      <div class="carousel-head reveal">
        <h3 class="carousel-title">Behind the scenes</h3>
        <span class="carousel-rule" aria-hidden="true"></span>
      </div>
      <div class="carousel" id="bts-carousel"></div>
    </section>

    <!-- ===================== WHAT WE DO ===================== -->
    <section class="section carousel-section" id="services">
      <div class="carousel-head reveal">
        <h3 class="carousel-title">What I do</h3>
        <span class="carousel-rule" aria-hidden="true"></span>
      </div>
      <div class="carousel" id="services-carousel"></div>
    </section>

    <!-- ===================== WORK (project index + preview) ===================== -->
    <section class="section work" id="work">
      <h3 class="section-label reveal">Selected work</h3>
      <div class="work-layout">
        <div class="work-preview" id="work-preview" aria-hidden="true">
          <div class="work-preview-ph"></div>
        </div>
        <ul class="work-index" id="work-index"></ul>
      </div>
    </section>

    <!-- ===================== CTA + FOOTER ===================== -->
    <section class="cta" id="contact">
      <p class="cta-kicker cta-kicker-left" id="cta-kicker-left"></p>
      <div class="cta-center">
        <p class="cta-heading" id="cta-heading"></p>
        <button class="cta-link" id="cta-link"></button>
      </div>
      <p class="cta-kicker cta-kicker-right" id="cta-kicker-right"></p>

      <footer id="footer">
        <div class="footer-row">
          <span id="footer-credit"></span>
        </div>
      </footer>
    </section>
  </main>

  <!-- ===================== WORK LIGHTBOX (tap on mobile) ===================== -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Work detail" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
    <div class="lightbox-inner">
      <div class="lightbox-media"><div class="lightbox-ph"></div></div>
      <div class="lightbox-info">
        <p class="lightbox-cat" id="lightbox-cat"></p>
        <h3 class="lightbox-title" id="lightbox-title"></h3>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
